# Plataforma web do CONECTA servida por nginx (RW-45, D3): build estático (`npm run build` → dist/)
# e a API no mesmo domínio, sob /api — o cookie de sessão (httpOnly, Secure, SameSite=Strict) é da
# API e só funciona em mesma origem e HTTPS. Referência para a infraestrutura do IFSul; verificada
# por deploy/verificar.sh num container nginx.
#
# A ajustar na instalação: server_name, os caminhos do certificado e o endereço da API (upstream).

upstream conecta_api {
    server api:8000;
}

# Porta do HTTPS no redirecionamento de HTTP: vazia quando é a 443. Se o HTTPS público usar outra
# porta, ajuste aqui (ex.: ":8443"); deploy/verificar.sh preenche a porta da verificação.
map $host $sufixo_porta_https {
    default "";
}

server {
    listen 80;
    server_name _;
    return 301 https://$host$sufixo_porta_https$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/conecta.crt;
    ssl_certificate_key /etc/nginx/certs/conecta.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    server_tokens off;

    # Cabeçalhos de segurança. Valem para /api/ (que não define nenhum); um location com add_header
    # próprio deixa de herdar estes e precisa repeti-los.
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;

    # A documentação da API (Swagger, ReDoc e o OpenAPI) não fica exposta pela plataforma.
    location ~ ^/api/(docs|redoc|openapi\.json)$ {
        return 404;
    }

    # API: /api/x → http://api:8000/x. O navegador fala só com esta origem. `$http_host` mantém a
    # porta que o navegador usou: redirecionamentos da própria API (barra no fim) não a perdem.
    location /api/ {
        proxy_pass http://conecta_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 30s;
    }

    # Arquivos com hash no nome: cache longo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=2592000" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # Qualquer outra rota é da aplicação (React Router): devolve o index.html, que não é guardado
    # em cache para que uma nova versão apareça na próxima visita.
    location / {
        add_header Cache-Control "no-cache" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Content-Security-Policy "default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'" always;
        try_files $uri /index.html;
    }
}
