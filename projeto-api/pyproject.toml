[project]
name = "conecta-api"
version = "0.1.0"
description = "API REST do CONECTA (autenticação, perfis, turmas e avisos)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "pydantic-settings>=2.4",
    "pyjwt>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["docs", ".specify"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
# Migrações são geradas pelo Alembic; SQL longo em CHECKs não é quebrado.
"alembic/versions/*" = ["E501"]

[tool.ruff.lint.isort]
# A pasta alembic/ do projeto não é o pacote alembic.
known-third-party = ["alembic"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Cookie", "fastapi.Header"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "mock_auth: depende do provedor de autenticação simulado (MockMoodleAuthProvider)",
    "moodle_real: integração real com o Moodle; ignorado sem MOODLE_URL configurado",
]
