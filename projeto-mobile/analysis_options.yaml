include: package:flutter_lints/flutter.yaml

# A regra "nenhum literal de cor fora de lib/theme/" (Princípio V) não existe como lint do Dart:
# é verificada por test/unit/design_system_test.dart.

linter:
  rules:
    - prefer_single_quotes
    - prefer_final_locals
    - always_declare_return_types
    - avoid_print
    - directives_ordering
    - unawaited_futures
